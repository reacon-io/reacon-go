name: SDK conformance

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: sdk-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
      - name: Replay reviewed responses and streaming scenarios
        env:
          REACON_SOURCE_REVISION: ${{ github.sha }}
        run: node .github/sdk-ci/run.mjs
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-ci-results/
          if-no-files-found: error
          retention-days: 30
