name: SDK conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_fresh_tests:
        description: Run conformance even when an exact passing proof exists
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: sdk-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Replay reviewed responses and streaming scenarios
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REACON_FORCE_FRESH_TESTS: ${{ inputs.force_fresh_tests || false }}
          REACON_SOURCE_REVISION: ${{ github.sha }}
        run: node .github/sdk-ci/verify-or-reuse.mjs
      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sdk-ci-results/verification-cache.json
            sdk-ci-results/evidence.json
            sdk-ci-results/responses.json
            sdk-ci-results/run.log
          if-no-files-found: error
          retention-days: 30
