name: SDK publication
run-name: SDK publisher identity · ${{ github.run_id }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.11.0
      - name: Install pinned publisher identity tools
        run: npm ci --prefix .github/sdk-release --ignore-scripts --no-audit --no-fund
      - name: Verify signed publisher identity without uploading a package
        run: node .github/sdk-release/verify-identity.mjs
      - name: Retain publisher identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-publisher-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: sdk-release-results/identity.json
          if-no-files-found: error
          retention-days: 30
